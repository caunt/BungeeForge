plugins {
    id 'java'
}

base {
    archivesName = 'bungeeforge'
}

repositories {
    mavenCentral()
}

sourceSets {
    // Stand-ins for the three @Mod annotations (Forge 1.7, Forge 1.8+, NeoForge).
    // They are only compiled against and never end up in the jar.
    stubs
}

dependencies {
    compileOnly sourceSets.stubs.output

    // Oldest versions shipped with Minecraft (1.7.10), so only APIs present everywhere get used.
    compileOnly 'io.netty:netty-all:4.0.10.Final'
    compileOnly 'com.google.code.gson:gson:2.2.4'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', version
    filesMatching(['mcmod.info', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand version: version
    }
}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'ua.caunt.bungeeforge'
    }
}
